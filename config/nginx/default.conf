# Example site. Replace this directory with your own configuration by mounting it at
# /etc/nginx/user_conf.d (read-only). rustinx never modifies files in that directory.
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/rustinx/html;

    location / {
        try_files $uri $uri/ =404;
    }
}
