server {
    listen 80 default_server;
    server_name rustinx.example.test www.rustinx.example.test;

    include /etc/rustinx/snippets/acme-http01.conf;
    include /etc/rustinx/snippets/managed-redirect.conf;
    include /etc/nginx/test-site.inc;
}

server {
    listen 80;
    server_name other.rustinx.example.test;
    include /etc/rustinx/snippets/acme-http01.conf;
    include /etc/nginx/test-site.inc;
}

server {
    listen 80;
    server_name invalid.rustinx.example.test;

    location / {
        return 404;
    }
}

server {
    listen 127.0.0.1:8082;
    location / {
        return 200 "upstream: $http_x_forwarded_proto\n";
    }
}
