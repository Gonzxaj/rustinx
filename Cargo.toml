[package]
name = "rustinx"
version = "0.1.0"
edition = "2024"
description = "Nginx supervised by a Rust manager, with automatic certificate management planned"
license = "MIT"
publish = false

[dependencies]
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
nix = { version = "0.32.0", features = ["signal", "process"] }
rustix = { version = "1.1.6", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "signal", "time", "net", "io-util", "sync"] }
tokio-util = "0.7.20"
toml = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
x509-parser = "0.18.1"
tempfile = "3.27.0"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "ring"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
