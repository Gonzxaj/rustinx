# Base Nginx configuration owned by the rustinx image.
# rustinx starts Nginx with: nginx -c /etc/rustinx/nginx.conf -e stderr -g 'daemon off;'
# so this file must not contain a `daemon` directive. Nginx runs as an unprivileged user,
# so there is no `user` directive and every runtime path is writable by that user.

worker_processes auto;
pid /run/rustinx/nginx.pid;
error_log stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /var/cache/rustinx/client_body;
    proxy_temp_path /var/cache/rustinx/proxy;
    fastcgi_temp_path /var/cache/rustinx/fastcgi;
    uwsgi_temp_path /var/cache/rustinx/uwsgi;
    scgi_temp_path /var/cache/rustinx/scgi;

    include /run/rustinx/https.conf;

    # Internal health endpoint used by `rustinx healthcheck` and startup readiness.
    # Loopback only. Port 8081 on 127.0.0.1 is reserved and must not be used by user configuration.
    server {
        listen 127.0.0.1:8081;
        access_log off;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /__rustinx/reload {
            default_type text/plain;
            return 200 "$rustinx_https_generation\n";
        }

        location / {
            return 404;
        }
    }

    # Configuration generated by rustinx (empty until automatic HTTPS is implemented).
    include /etc/nginx/managed-conf.d/*.conf;

    # User-provided configuration. rustinx never modifies these files.
    include /etc/nginx/user_conf.d/*.conf;
}
